<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d040c">
<meta name="robots" content="noindex, nofollow">
<title>Pour Sheyi ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --vin:#1d040c; --rouge:#8b1a2b; --rose:#eab8c2; --ivoire:#fff8f2;
  --or:#d9b370; --or-clair:#f3dba8; --encre:#4a1222;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --script:'Pinyon Script','Snell Roundhand','Brush Script MT',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--vin);-webkit-text-size-adjust:100%}
body{
  min-height:100vh;min-height:100svh;color:var(--ivoire);font-family:var(--serif);
  background:var(--vin);overflow-x:hidden;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%,rgba(139,26,43,.75),transparent 70%),
    radial-gradient(ellipse 90% 55% at 50% 100%,rgba(96,16,38,.7),transparent 70%);
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
main{position:relative;z-index:2}
[hidden]{display:none!important}

/* Bouton musique */
#son{
  position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + .8rem);right:.9rem;
  font:600 .95rem/1 var(--serif);color:var(--rose);background:rgba(29,4,12,.55);
  border:1px solid rgba(234,184,194,.45);border-radius:999px;padding:.55rem .95rem;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;
  transition:transform .2s,background .3s,color .3s;
}
#son:active{transform:scale(.94)}
#son[aria-pressed="true"]{background:rgba(217,179,112,.18);color:var(--or-clair);border-color:var(--or)}

/* Boutons */
.btn{
  position:relative;overflow:hidden;font:italic 600 1.3rem/1.2 var(--serif);letter-spacing:.01em;
  color:var(--or-clair);padding:1rem 2rem;border-radius:999px;border:1px solid var(--or);
  background:linear-gradient(135deg,#a3213a,#6d1124);cursor:pointer;
  box-shadow:0 0 30px rgba(217,179,112,.22),inset 0 0 14px rgba(255,255,255,.06);
  transition:transform .18s ease,box-shadow .3s ease;-webkit-tap-highlight-color:transparent;
}
.btn::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);
  transform:translateX(-120%);animation:brillance 4.6s ease-in-out 1.5s infinite;
}
.btn:active{transform:scale(.94);box-shadow:0 0 44px rgba(234,184,194,.5)}
.btn:disabled{opacity:.75;cursor:default}
@media (hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:0 0 44px rgba(217,179,112,.4)}}
.btn:focus-visible,#son:focus-visible{outline:2px solid var(--or-clair);outline-offset:3px}
@keyframes brillance{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}

/* Accueil */
.ecran{
  position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:4.5rem 1.5rem 3rem;gap:1.8rem;
}
.halo{
  position:absolute;left:50%;top:42%;width:min(90vw,34rem);aspect-ratio:1;translate:-50% -50%;
  border-radius:50%;background:radial-gradient(circle,rgba(234,184,194,.28),rgba(139,26,43,.12) 45%,transparent 70%);
  filter:blur(18px);animation:respire 7s ease-in-out infinite;pointer-events:none;
}
@keyframes respire{0%,100%{scale:.9;opacity:.7}50%{scale:1.08;opacity:1}}
h1{
  position:relative;font:400 clamp(2.5rem,11vw,4.6rem)/1.15 var(--script);color:var(--or-clair);
  text-shadow:0 0 22px rgba(243,219,168,.45),0 0 60px rgba(234,184,194,.35);max-width:14ch;
}
.mot{display:inline-block;white-space:nowrap}
.l{display:inline-block;opacity:0;filter:blur(8px);animation:lettre 1.2s ease-out both}
@keyframes lettre{to{opacity:1;filter:blur(0)}}
.intro{
  position:relative;max-width:30rem;font:italic 500 clamp(1.2rem,4.6vw,1.45rem)/1.65 var(--serif);
  color:var(--rose);animation:apparait 1.8s ease-out 3.1s both;
}
#ouvrir{position:relative;animation:apparait 1.6s ease-out 5s both}
@keyframes apparait{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:blur(0)}}

/* Porte */
#porte{position:fixed;inset:0;z-index:30;display:flex;pointer-events:none}
#porte .p{flex:1;transition:transform 1s cubic-bezier(.7,0,.2,1);
  background:linear-gradient(180deg,#5b1226,#2a0711 60%,#3e0b1b)}
#porte .g{transform:translateX(-101%);border-right:1px solid var(--or);box-shadow:inset -12px 0 30px rgba(217,179,112,.12)}
#porte .d{transform:translateX(101%);border-left:1px solid var(--or);box-shadow:inset 12px 0 30px rgba(217,179,112,.12)}
#porte::after{
  content:"❤";position:absolute;left:50%;top:50%;translate:-50% -50%;font-size:2.4rem;color:var(--or-clair);
  text-shadow:0 0 24px rgba(243,219,168,.9);opacity:0;transition:opacity .5s ease .4s;
}
#porte.on{pointer-events:auto}
#porte.on .p{transform:none}
#porte.on::after{opacity:1}

/* Lettre */
#lettre{padding:4.5rem 1.1rem 5rem}
.papier{
  max-width:35rem;margin:0 auto;padding:2.4rem 1.6rem 1.6rem;color:var(--encre);
  background:linear-gradient(180deg,#fffaf5,#fbeee9);border-radius:6px;
  border:1px solid rgba(217,179,112,.7);
  box-shadow:0 0 0 6px rgba(255,248,242,.06),0 0 70px rgba(234,184,194,.3),0 24px 60px rgba(0,0,0,.45);
  position:relative;
}
.papier::before{content:"";position:absolute;inset:8px;border:1px solid rgba(217,179,112,.45);border-radius:3px;pointer-events:none}
.salut{font:400 2.3rem/1.2 var(--script);color:var(--rouge);margin-bottom:1.4rem}
.papier p{font:500 clamp(1.2rem,4.7vw,1.38rem)/1.72 var(--serif);margin-bottom:1.15em;hyphens:auto}
.fondu{opacity:0;filter:blur(4px);transition:opacity 1.8s ease,filter 1.8s ease}
.fondu.vu{opacity:1;filter:blur(0)}

/* Final */
#final{min-height:75vh;min-height:75svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2rem;padding:3rem .5rem}
.grand{font:italic 500 clamp(1.8rem,7vw,2.8rem)/1.3 var(--serif);color:var(--rose);max-width:20ch;text-shadow:0 0 28px rgba(234,184,194,.4)}
#reponse{font:italic 500 clamp(1.3rem,5vw,1.7rem)/1.6 var(--serif);color:var(--ivoire);max-width:28rem}

/* Signature */
#signature{text-align:center;padding:1rem 0 3rem;visibility:hidden}
#signature.show{visibility:visible}
.avec{font:italic 500 1.3rem/1.4 var(--serif);color:var(--rose);opacity:0}
.show .avec{animation:apparait 1.8s ease-out both}
.sig{display:inline-flex;align-items:center;gap:.4rem;margin-top:.6rem;font:400 clamp(3.4rem,16vw,5.4rem)/1.3 var(--script);color:var(--or-clair);text-shadow:0 0 24px rgba(243,219,168,.5)}
.sig .nom{clip-path:inset(-30% 100% -30% -5%)}
.show .sig .nom{animation:trace 2.6s cubic-bezier(.45,.1,.35,1) 1.6s forwards}
@keyframes trace{to{clip-path:inset(-30% -15% -30% -5%)}}
.sig .coeur{font-size:.42em;opacity:0;font-family:var(--serif)}
.show .sig .coeur{animation:apparait 1s ease-out 4.2s forwards,pouls 2.4s ease-in-out 5.2s infinite}
@keyframes pouls{0%,100%{transform:scale(1);filter:drop-shadow(0 0 4px rgba(255,120,150,.6))}50%{transform:scale(1.25);filter:drop-shadow(0 0 16px rgba(255,150,180,.95))}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<button id="son" type="button" aria-pressed="false">♪ Musique</button>

<main>
  <section id="accueil" class="ecran">
    <div class="halo"></div>
    <h1 id="titre" aria-label=""></h1>
    <p class="intro" id="intro"></p>
    <button id="ouvrir" class="btn" type="button"></button>
  </section>

  <section id="lettre" hidden>
    <article class="papier">
      <p class="salut fondu" id="salut"></p>
      <div id="corps"></div>
    </article>
    <div id="final">
      <p class="grand fondu" id="recompense"></p>
      <button id="sourire" class="btn fondu" type="button"></button>
      <p id="reponse" class="fondu"></p>
    </div>
    <div id="signature">
      <p class="avec" id="avec"></p>
      <div class="sig"><span class="nom" id="nom"></span><span class="coeur">❤️</span></div>
    </div>
  </section>
</main>

<div id="porte" aria-hidden="true"><div class="p g"></div><div class="p d"></div></div>

<script>
/* ================================================================
   ✏️  PERSONNALISATION : modifie uniquement les textes ci-dessous
   ================================================================ */
const CONFIG = {
  titre: "Pour Mademoiselle Sheyi… ❤️",
  intro: "Il y a des attentions qui ne s’expliquent pas toujours avec de grands discours… Certaines se découvrent simplement en ouvrant une petite porte. Aujourd’hui, j’aimerais t’en faire découvrir une.",
  boutonOuvrir: "Une petite surprise pour toi ✨",

  salutation: "Chère Sheyi,",
  lettre: [
    "Tu sais, parfois, une personne attire notre attention d’une manière particulière, sans même avoir besoin d’en faire trop.",
    "Et aujourd’hui, j’avais simplement envie de te consacrer une petite attention, quelque chose de différent, juste pour te faire sourire et te montrer que tu occupes une place particulière dans mes pensées.",
    "Je ne suis pas là pour te promettre la lune ni pour te raconter de belles histoires simplement pour impressionner. Je préfère les gestes sincères aux grandes promesses, et les petites attentions aux paroles qui ne sont jamais suivies d’actes.",
    "Si j’ai imaginé cette petite surprise pour toi, c’est parce que je trouve que certaines personnes méritent qu’on prenne le temps de faire quelque chose de spécial pour elles.",
    "Alors, aujourd’hui, je voulais simplement que tu saches que tu as attiré mon attention, que j’apprécie ce petit quelque chose qui te rend particulière à mes yeux et que l’idée de te faire sourire me plaît sincèrement.",
    "Je ne sais pas ce que demain nous réserve, et je ne veux rien précipiter. Je voulais juste partager avec toi une petite partie de ce que je ressens, avec douceur, sincérité et une pointe de romantisme.",
    "Après tout, les plus belles histoires ne commencent pas toujours par de grandes déclarations. Parfois, elles commencent par une simple attention, un sourire et l’envie d’en découvrir un peu plus sur l’autre.",
    "Alors, Sheyi, si cette petite surprise t’a fait sourire, considère que mon objectif est déjà atteint. ❤️"
  ],

  recompense: "Un petit sourire de ta part serait déjà une jolie récompense. ❤️",
  boutonSourire: "Tu m’accordes un petit sourire ? 😊",
  reponse: "Mission accomplie… du moins, je l’espère. Et si cette petite attention t’a fait sourire, alors cette journée aura déjà quelque chose de spécial. ✨",

  avantSignature: "Avec une attention toute particulière…",
  signature: "Pascal"
};

/* ================================================================
   Le reste est la mécanique du site
   ================================================================ */
const $ = id => document.getElementById(id);
const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Contenu ---------- */
document.title = CONFIG.titre.replace('Mademoiselle ', '');
(function(){
  const h = $('titre'); h.setAttribute('aria-label', CONFIG.titre);
  let i = 0;
  CONFIG.titre.split(' ').forEach((mot, k, arr) => {
    const m = document.createElement('span'); m.className = 'mot'; m.setAttribute('aria-hidden', 'true');
    [...mot].forEach(c => {
      const s = document.createElement('span'); s.className = 'l'; s.textContent = c;
      s.style.animationDelay = (0.6 + i++ * 0.075) + 's'; m.appendChild(s);
    });
    h.appendChild(m); if (k < arr.length - 1) h.appendChild(document.createTextNode(' '));
  });
})();
$('intro').textContent = CONFIG.intro;
$('ouvrir').textContent = CONFIG.boutonOuvrir;
$('salut').textContent = CONFIG.salutation;
CONFIG.lettre.forEach(t => {
  const p = document.createElement('p'); p.className = 'fondu'; p.textContent = t; $('corps').appendChild(p);
});
$('recompense').textContent = CONFIG.recompense;
$('sourire').textContent = CONFIG.boutonSourire;
$('reponse').textContent = CONFIG.reponse;
$('avec').textContent = CONFIG.avantSignature;
$('nom').textContent = CONFIG.signature;

/* ---------- Particules et cœurs ---------- */
const cv = $('fx'), cx = cv.getContext('2d');
let W, H, D;
const poussieres = [], coeurs = [];
const COULEURS = ['234,184,194', '214,60,90', '243,219,168', '255,248,242', '190,40,65'];

function dimension(){
  D = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * D; cv.height = H * D; cx.setTransform(D, 0, 0, D, 0, 0);
  const n = Math.round(Math.min(W * H / 9000, 90)) * (reduit ? .4 : 1);
  while (poussieres.length < n) poussieres.push(nouvellePoussiere());
  poussieres.length = Math.min(poussieres.length, n);
}
function nouvellePoussiere(){
  return {x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.7 + .4,
    vy: -(Math.random() * .18 + .04), vx: (Math.random() - .5) * .12, ph: Math.random() * 6.28, v: Math.random() * .03 + .008};
}
function nouveauCoeur(o){
  return Object.assign({
    x: Math.random() * W, y: H + 20, s: Math.random() * 14 + 8, vx: 0, vy: -(Math.random() * .45 + .25), ay: 0,
    ph: Math.random() * 6.28, amp: Math.random() * 22 + 8, base: Math.random() * .3 + .3,
    col: COULEURS[(Math.random() * COULEURS.length) | 0], t: 0, dur: Infinity
  }, o);
}
function traceCoeur(x, y, s){
  cx.beginPath(); cx.moveTo(x, y + s * .3);
  cx.bezierCurveTo(x, y - s * .1, x - s * .6, y - s * .1, x - s * .6, y + s * .25);
  cx.bezierCurveTo(x - s * .6, y + s * .65, x, y + s * .85, x, y + s * 1.05);
  cx.bezierCurveTo(x, y + s * .85, x + s * .6, y + s * .65, x + s * .6, y + s * .25);
  cx.bezierCurveTo(x + s * .6, y - s * .1, x, y - s * .1, x, y + s * .3); cx.closePath();
}
/* Éclat de cœurs depuis un point */
function eclat(x, y, n){
  for (let i = 0; i < n; i++) coeurs.push(nouveauCoeur({
    x, y, s: Math.random() * 12 + 6, vx: (Math.random() - .5) * 4, vy: -(Math.random() * 3.2 + 1),
    ay: .018, amp: 4, base: .95, t: 0, dur: 110 + Math.random() * 70
  }));
}
/* Envol : des cœurs montent de tout le bas de l'écran */
function envol(n){
  for (let i = 0; i < n; i++) setTimeout(() => coeurs.push(nouveauCoeur({
    y: H + 10, s: Math.random() * 20 + 10, vy: -(Math.random() * 1.6 + 1), amp: Math.random() * 30 + 10, base: .85
  })), i * 55);
}

let dernier = 0;
function boucle(t){
  const k = Math.min((t - dernier) / 16.7 || 1, 3); dernier = t;
  cx.clearRect(0, 0, W, H);
  /* poussières dorées */
  for (const p of poussieres){
    p.x += p.vx * k; p.y += p.vy * k; p.ph += p.v * k;
    if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
    const a = .25 + .5 * Math.abs(Math.sin(p.ph));
    cx.fillStyle = 'rgba(243,219,168,' + a * .18 + ')'; cx.beginPath(); cx.arc(p.x, p.y, p.r * 3, 0, 6.283); cx.fill();
    cx.fillStyle = 'rgba(255,238,200,' + a + ')'; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.283); cx.fill();
  }
  /* cœurs d'ambiance */
  const ambiants = coeurs.reduce((n, c) => n + (c.dur === Infinity), 0);
  if (!reduit && ambiants < (W < 600 ? 14 : 26) && Math.random() < .03 * k) coeurs.push(nouveauCoeur());
  for (let i = coeurs.length - 1; i >= 0; i--){
    const c = coeurs[i]; c.t += k; c.vy += c.ay * k; c.x += c.vx * k; c.y += c.vy * k; c.vx *= .992;
    if (c.y < -40 || c.t > c.dur) { coeurs.splice(i, 1); continue; }
    let a = c.base * Math.min(1, c.t / 50);
    a *= c.dur === Infinity ? Math.min(1, c.y / (H * .3)) : 1 - c.t / c.dur;
    const x = c.x + Math.sin(c.t * .025 + c.ph) * c.amp;
    cx.fillStyle = 'rgba(' + c.col + ',' + Math.max(a, 0) * .22 + ')'; traceCoeur(x, c.y, c.s * 1.7); cx.fill();
    cx.fillStyle = 'rgba(' + c.col + ',' + Math.max(a, 0) + ')'; traceCoeur(x, c.y, c.s); cx.fill();
  }
  requestAnimationFrame(boucle);
}
dimension(); addEventListener('resize', dimension);
if (!reduit) for (let i = 0; i < 7; i++) coeurs.push(nouveauCoeur({y: Math.random() * H}));
requestAnimationFrame(boucle);

/* ---------- Apparition progressive du texte ---------- */
const obs = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('vu'); obs.unobserve(e.target); }
}), {threshold: .35});
function observer(){ document.querySelectorAll('#lettre .fondu').forEach(el => { if (el.id !== 'reponse') obs.observe(el); }); }

/* ---------- Étape 1 : ouvrir la porte ---------- */
$('ouvrir').addEventListener('click', e => {
  const b = e.currentTarget; b.disabled = true;
  const r = b.getBoundingClientRect(); eclat(r.left + r.width / 2, r.top + r.height / 2, 16);
  $('porte').classList.add('on');
  setTimeout(() => {
    $('accueil').hidden = true; $('lettre').hidden = false; window.scrollTo(0, 0); observer();
    $('porte').classList.remove('on'); envol(10);
  }, 1300);
});

/* ---------- Étape 2 : le sourire ---------- */
$('sourire').addEventListener('click', e => {
  const b = e.currentTarget; b.disabled = true;
  const r = b.getBoundingClientRect(); eclat(r.left + r.width / 2, r.top + r.height / 2, 34); envol(34);
  setTimeout(() => $('reponse').classList.add('vu'), 700);
  setTimeout(() => {
    $('signature').classList.add('show');
    $('signature').scrollIntoView({behavior: reduit ? 'auto' : 'smooth', block: 'center'});
    eclat(W / 2, H * .6, 12);
  }, 3600);
});

/* ---------- Musique douce (facultative, désactivée par défaut) ---------- */
(function(){
  const bouton = $('son');
  const ACCORDS = [[130.81,196,261.63,329.63,392],[110,164.81,261.63,329.63,392],[87.31,174.61,261.63,329.63,440],[98,196,246.94,293.66,392]];
  let ac, maitre, minuteur, i = 0;
  function accord(){
    const t0 = ac.currentTime;
    ACCORDS[i++ % ACCORDS.length].forEach((f, n) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = n < 2 ? 'sine' : 'triangle'; o.frequency.value = f; o.detune.value = (Math.random() - .5) * 8;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(n < 2 ? .07 : .035, t0 + 2.2);
      g.gain.linearRampToValueAtTime(0, t0 + 7);
      o.connect(g); g.connect(maitre); o.start(t0); o.stop(t0 + 7.2);
    });
  }
  function demarrer(){
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      ac = new AC(); maitre = ac.createGain(); maitre.gain.value = .8;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
      maitre.connect(f); f.connect(ac.destination);
    }
    ac.resume(); accord(); minuteur = setInterval(accord, 6000); return true;
  }
  bouton.addEventListener('click', () => {
    const actif = bouton.getAttribute('aria-pressed') === 'true';
    if (actif) { clearInterval(minuteur); ac.suspend(); }
    else if (!demarrer()) return;
    bouton.setAttribute('aria-pressed', String(!actif));
    bouton.textContent = actif ? '♪ Musique' : '♪ Musique activée';
  });
  document.addEventListener('visibilitychange', () => {
    if (!ac || bouton.getAttribute('aria-pressed') !== 'true') return;
    if (document.hidden) ac.suspend(); else ac.resume();
  });
})();
</script>
</body>
</html>
